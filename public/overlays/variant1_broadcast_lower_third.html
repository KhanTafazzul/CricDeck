<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Overlay 1 — Broadcast Lower Third</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }
    body.test-bg {
      background: #0d1117 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><rect width="80" height="80" fill="%230d1117"/><path d="M0 0h80v80H0z" fill="none" stroke="%23161b22" stroke-width="1"/></svg>') repeat !important;
    }

    /* 1920x1080 Viewport with 96px safe margin guide */
    .viewport {
      position: relative;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
    }

    /* Panel Container: 760 x 120px, 80px from left and bottom */
    .overlay-panel {
      position: absolute;
      left: 80px;
      bottom: 80px;
      width: 760px;
      height: 120px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 100%), rgba(11, 26, 51, 0.85);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.4), inset 0 -1px 0 rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      padding: 14px 24px;
      transform: translateX(0);
      opacity: 1;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease-out;
      animation: slideInLeft 650ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: auto;
    }

    .overlay-panel.exiting {
      transform: translateX(-120%);
      opacity: 0;
      transition: transform 0.65s cubic-bezier(0.7, 0, 0.84, 0), opacity 0.5s ease-in;
    }

    @keyframes slideInLeft {
      0% {
        transform: translateX(-120%);
        opacity: 0;
      }
      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* PRE-MATCH / LIVE tag */
    .tag-badge {
      position: absolute;
      top: -14px;
      left: 18px;
      background: #F5B800;
      color: #0B1A33;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }
    .tag-badge.live-mode {
      background: #E63946;
      color: #FFFFFF;
      animation: pulseLive 1.5s infinite;
    }
    @keyframes pulseLive {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }

    /* Content Area */
    .panel-body {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      justifyContent: space-between;
    }

    /* Subtitle & Match Title */
    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .match-title {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9FB3C8;
    }
    .match-venue {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #6c8299;
    }

    /* Teams row with angled skew bars */
    .teams-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }
    .bars-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .skew-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 18px;
      transform: skewX(-12deg);
      border-radius: 4px;
    }
    .skew-bar.team-a {
      background: var(--team-a-color, #F5B800);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    .skew-bar.team-b {
      background: var(--team-b-color, #E63946);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    .unskew {
      transform: skewX(12deg);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .team-code {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 54px;
      font-weight: 800;
      font-style: italic;
      text-transform: uppercase;
      line-height: 1;
    }
    .skew-bar.team-a .team-code {
      color: #0B1A33;
    }
    .skew-bar.team-b .team-code {
      color: #FFFFFF;
    }

    .vs-divider {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 800;
      font-style: italic;
      color: #9FB3C8;
    }

    /* Countdown Section */
    .countdown-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      padding-left: 20px;
      min-width: 140px;
    }
    .countdown-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #9FB3C8;
    }
    .countdown-time {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 40px;
      font-weight: 800;
      font-style: italic;
      color: #FFFFFF;
      line-height: 1;
      margin-top: 2px;
    }

    /* Test Background & Live Controls (Hidden in OBS, toggleable) */
    .controls-overlay {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 9999;
      pointer-events: auto;
    }
    .ctrl-btn {
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    @media (prefers-reduced-motion: reduce) {
      .overlay-panel {
        animation: none !important;
        transition: opacity 0.2s ease !important;
      }
      .tag-badge.live-mode {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="viewport">
    <!-- Test controls -->
    <div class="controls-overlay">
      <button class="ctrl-btn" onclick="toggleTestBg()">Toggle Dark BG (B)</button>
      <button class="ctrl-btn" style="background: #E63946;" onclick="window.goLive()">Trigger Go Live</button>
    </div>

    <!-- Variant 1 Panel -->
    <div class="overlay-panel" id="mainPanel">
      <div class="tag-badge" id="liveTag">PRE-MATCH</div>
      
      <div class="panel-body">
        <div class="match-header">
          <span class="match-title" id="matchTitle">{MATCH_TITLE} • {SERIES}</span>
          <span class="match-venue" id="venueText">{VENUE}</span>
        </div>

        <div class="teams-row">
          <div class="bars-container">
            <!-- Team A Skew Bar -->
            <div class="skew-bar team-a">
              <div class="unskew">
                <span class="team-code" id="teamACode">{TEAM_A_CODE}</span>
              </div>
            </div>

            <span class="vs-divider">VS</span>

            <!-- Team B Skew Bar -->
            <div class="skew-bar team-b">
              <div class="unskew">
                <span class="team-code" id="teamBCode">{TEAM_B_CODE}</span>
              </div>
            </div>
          </div>

          <!-- Countdown -->
          <div class="countdown-box">
            <span class="countdown-label">STARTS IN</span>
            <span class="countdown-time" id="countdownVal">15:00</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="overlay_shared.js"></script>
  <script>
    window.goLive = function() {
      const panel = document.getElementById('mainPanel');
      const tag = document.getElementById('liveTag');
      tag.textContent = 'LIVE';
      tag.classList.add('live-mode');

      setTimeout(() => {
        panel.classList.add('exiting');
      }, 700);
    };

    CricDeckOverlay.init((data) => {
      document.getElementById('teamACode').textContent = data.teamA;
      document.getElementById('teamBCode').textContent = data.teamB;
      document.getElementById('matchTitle').textContent = data.title;
      document.getElementById('venueText').textContent = data.venue;
    });
  </script>
</body>
</html>
