<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Overlay 7 — Arena Matchup HUD (ICC Broadcast)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --team-a-color: #0047AB;
      --team-b-color: #E63946;
      --accent-glow: #00FF88;
      --glass-bg: rgba(10, 16, 30, 0.82);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }

    body.test-bg {
      background: #080c14 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><rect width="80" height="80" fill="%23080c14"/><path d="M0 0h80v80H0z" fill="none" stroke="%23131c2e" stroke-width="1"/></svg>') repeat !important;
    }

    .viewport {
      position: relative;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
    }

    /* Arena Matchup HUD Container: 1400px wide, 280px high, bottom 96px */
    .arena-container {
      position: absolute;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%);
      width: 1400px;
      height: 280px;
      display: flex;
      align-items: stretch;
      pointer-events: auto;
      perspective: 1200px;
      animation: arenaGlideIn 680ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .arena-container.exiting {
      transform: translateX(-50%) translateY(60px) scale(0.92);
      opacity: 0;
      transition: all 500ms cubic-bezier(0.7, 0, 0.84, 0);
    }

    @keyframes arenaGlideIn {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(80px) scale(0.94);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }

    /* Top Ribbon: Series Title & Match Info */
    .arena-top-ribbon {
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 100%), rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      padding: 6px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      z-index: 25;
      white-space: nowrap;
    }

    .ribbon-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 9999px;
      background: rgba(34, 197, 94, 0.18);
      border: 1px solid rgba(34, 197, 94, 0.45);
      color: #86efac;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .ribbon-tag.live-active {
      background: rgba(239, 68, 68, 0.22);
      border-color: #ef4444;
      color: #fca5a5;
    }

    .ribbon-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: blinkDot 1.4s infinite ease-in-out;
    }
    .ribbon-tag.live-active .ribbon-dot {
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    .ribbon-text {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #F8FAFC;
    }

    .ribbon-venue {
      font-size: 12px;
      color: #94A3B8;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      padding-left: 14px;
    }

    /* Team Battle Wings (Angled Skew Pods) */
    .team-wing {
      flex: 1;
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 28px 36px;
      display: flex;
      align-items: center;
      gap: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.35), inset 0 -1px 0 rgba(0, 0, 0, 0.3);
      overflow: hidden;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .team-wing-a {
      border-right: none;
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      padding-right: 50px;
    }
    .team-wing-a::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 8px;
      height: 100%;
      background: var(--team-a-color);
      box-shadow: 0 0 25px var(--team-a-color);
    }
    .team-wing-a::after {
      content: "";
      position: absolute;
      top: -40%;
      left: -20%;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--team-a-color) 0%, transparent 70%);
      opacity: 0.22;
      pointer-events: none;
    }

    .team-wing-b {
      border-left: none;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      padding-left: 50px;
      flex-direction: row-reverse;
      text-align: right;
    }
    .team-wing-b::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 8px;
      height: 100%;
      background: var(--team-b-color);
      box-shadow: 0 0 25px var(--team-b-color);
    }
    .team-wing-b::after {
      content: "";
      position: absolute;
      top: -40%;
      right: -20%;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--team-b-color) 0%, transparent 70%);
      opacity: 0.22;
      pointer-events: none;
    }

    /* Team Logos */
    .logo-slot {
      width: 140px;
      height: 140px;
      min-width: 140px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      overflow: hidden;
      z-index: 2;
    }
    .logo-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
    }
    .logo-fallback {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 54px;
      font-weight: 900;
      font-style: italic;
      color: #FFFFFF;
      letter-spacing: 0.05em;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
    }

    /* Team Info Typography */
    .team-info {
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .team-code {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 80px;
      font-weight: 900;
      font-style: italic;
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .team-wing-a .team-code {
      background: linear-gradient(135deg, #FFFFFF 40%, var(--team-a-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .team-wing-b .team-code {
      background: linear-gradient(135deg, #FFFFFF 40%, var(--team-b-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .team-name {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #F8FAFC;
    }
    .team-status-tag {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #94A3B8;
    }

    /* Center Nexus Hub (VS & Countdown) */
    .center-nexus {
      width: 280px;
      min-width: 280px;
      position: relative;
      background: linear-gradient(180deg, rgba(20, 30, 50, 0.95) 0%, rgba(10, 16, 26, 0.98) 100%);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      clip-path: polygon(15px 0, calc(100% - 15px) 0, 100% 100%, 0 100%);
    }

    .nexus-vs-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 42px;
      font-weight: 900;
      font-style: italic;
      color: #FFFFFF;
      letter-spacing: 0.15em;
      line-height: 1;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #FFFFFF 0%, #00FF88 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(0, 255, 136, 0.3));
    }

    .nexus-toss-box {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #F8FAFC;
      text-align: center;
      line-height: 1.35;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      max-width: 240px;
      margin-bottom: 12px;
    }

    .nexus-countdown-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #94A3B8;
      margin-bottom: 2px;
    }

    .nexus-countdown-digits {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #00FF88;
      text-shadow: 0 0 16px rgba(0, 255, 136, 0.4);
      font-variant-numeric: tabular-nums;
    }

    /* Ambient Scanline */
    .scanline {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(0, 255, 136, 0.6) 50%, transparent 100%);
      animation: scanSweep 4s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes scanSweep {
      0% { top: 0%; opacity: 0.3; }
      100% { top: 100%; opacity: 0.8; }
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="viewport" id="viewport">
    <div class="arena-container" id="arenaPanel">
      <div class="scanline"></div>

      <!-- Top Ribbon -->
      <div class="arena-top-ribbon">
        <div class="ribbon-tag" id="statusBadge">
          <span class="ribbon-dot"></span>
          <span id="tagText">PRE-MATCH</span>
        </div>
        <div class="ribbon-text" id="matchTitleText">1ST ODI • ICC CRICKET WORLD CUP</div>
        <div class="ribbon-venue" id="venueText">MELBOURNE CRICKET GROUND</div>
      </div>

      <!-- Team A Wing -->
      <div class="team-wing team-wing-a" id="teamAWing">
        <div class="logo-slot" id="logoSlotA">
          <div class="logo-fallback" id="fallbackCodeA">AUS</div>
        </div>
        <div class="team-info">
          <div class="team-code" id="teamACode">AUS</div>
          <div class="team-name" id="teamAName">AUSTRALIA</div>
          <div class="team-status-tag" id="teamATag">INNINGS 1 BATTERS READY</div>
        </div>
      </div>

      <!-- Center Nexus -->
      <div class="center-nexus">
        <div class="nexus-vs-badge">VS</div>
        <div class="nexus-toss-box" id="tossText">
          INDIA WON TOSS & ELECTED TO BOWL FIRST
        </div>
        <div class="nexus-countdown-label">MATCH STARTS IN</div>
        <div class="nexus-countdown-digits" id="countdownDisplay">15:00</div>
      </div>

      <!-- Team B Wing -->
      <div class="team-wing team-wing-b" id="teamBWing">
        <div class="logo-slot" id="logoSlotB">
          <div class="logo-fallback" id="fallbackCodeB">IND</div>
        </div>
        <div class="team-info">
          <div class="team-code" id="teamBCode">IND</div>
          <div class="team-name" id="teamBName">INDIA</div>
          <div class="team-status-tag" id="teamBTag">FIELDING XI CONFIRMED</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Live Match State & Configuration
    let config = {
      teamAName: "AUSTRALIA",
      teamACode: "AUS",
      teamAColor: "#0047AB",
      teamALogo: "",
      teamBName: "INDIA",
      teamBCode: "IND",
      teamBColor: "#E63946",
      teamBLogo: "",
      useTeamColors: true,
      matchTitle: "1ST ODI • ICC CRICKET WORLD CUP",
      series: "ICC MEN'S CRICKET WORLD CUP 2026",
      venue: "MELBOURNE CRICKET GROUND",
      tossInfo: "INDIA WON TOSS & ELECTED TO BOWL FIRST",
      minutes: 15,
      countdownTarget: new Date(Date.now() + 15 * 60 * 1000).toISOString()
    };

    function loadSharedMatchData() {
      // 1. Check URL Params
      const p = new URLSearchParams(window.location.search);
      if (p.has('teamA')) config.teamACode = p.get('teamA');
      if (p.has('teamAName')) config.teamAName = p.get('teamAName');
      if (p.has('teamAColor')) config.teamAColor = p.get('teamAColor');
      if (p.has('teamALogo')) config.teamALogo = p.get('teamALogo');
      if (p.has('teamB')) config.teamBCode = p.get('teamB');
      if (p.has('teamBName')) config.teamBName = p.get('teamBName');
      if (p.has('teamBColor')) config.teamBColor = p.get('teamBColor');
      if (p.has('teamBLogo')) config.teamBLogo = p.get('teamBLogo');
      if (p.has('useTeamColors')) config.useTeamColors = p.get('useTeamColors') !== '0';
      if (p.has('title')) config.matchTitle = p.get('title');
      if (p.has('series')) config.series = p.get('series');
      if (p.has('venue')) config.venue = p.get('venue');
      if (p.has('toss')) config.tossInfo = p.get('toss');
      if (p.has('minutes')) {
        config.minutes = parseInt(p.get('minutes')) || 15;
        config.countdownTarget = new Date(Date.now() + config.minutes * 60 * 1000).toISOString();
      }

      // 2. Check LocalStorage fallback if not in params
      try {
        const raw = localStorage.getItem('cricdeck_overlay_shared_data');
        if (raw && !p.has('teamA')) {
          const saved = JSON.parse(raw);
          if (saved.teamACode) config.teamACode = saved.teamACode;
          if (saved.teamAName) config.teamAName = saved.teamAName;
          if (saved.teamAColor) config.teamAColor = saved.teamAColor;
          if (saved.teamALogo) config.teamALogo = saved.teamALogo;
          if (saved.teamBCode) config.teamBCode = saved.teamBCode;
          if (saved.teamBName) config.teamBName = saved.teamBName;
          if (saved.teamBColor) config.teamBColor = saved.teamBColor;
          if (saved.teamBLogo) config.teamBLogo = saved.teamBLogo;
          if (saved.matchTitle) config.matchTitle = saved.matchTitle;
          if (saved.venue) config.venue = saved.venue;
          if (saved.tossInfo) config.tossInfo = saved.tossInfo;
        }
      } catch (_) {}

      renderOverlay();
    }

    function renderOverlay() {
      // Dynamic Colors
      if (config.useTeamColors) {
        document.documentElement.style.setProperty('--team-a-color', config.teamAColor || '#0047AB');
        document.documentElement.style.setProperty('--team-b-color', config.teamBColor || '#E63946');
      } else {
        document.documentElement.style.setProperty('--team-a-color', '#00FF88');
        document.documentElement.style.setProperty('--team-b-color', '#00C2A8');
      }

      // Team A
      document.getElementById('teamACode').textContent = config.teamACode || 'TMA';
      document.getElementById('teamAName').textContent = config.teamAName || 'Team A';
      const slotA = document.getElementById('logoSlotA');
      if (config.teamALogo) {
        slotA.innerHTML = `<img src="${config.teamALogo}" alt="logo" />`;
      } else {
        slotA.innerHTML = `<div class="logo-fallback">${config.teamACode || 'A'}</div>`;
      }

      // Team B
      document.getElementById('teamBCode').textContent = config.teamBCode || 'TMB';
      document.getElementById('teamBName').textContent = config.teamBName || 'Team B';
      const slotB = document.getElementById('logoSlotB');
      if (config.teamBLogo) {
        slotB.innerHTML = `<img src="${config.teamBLogo}" alt="logo" />`;
      } else {
        slotB.innerHTML = `<div class="logo-fallback">${config.teamBCode || 'B'}</div>`;
      }

      // Meta
      document.getElementById('matchTitleText').textContent = config.matchTitle || 'ICC CRICKET LIVE';
      document.getElementById('venueText').textContent = config.venue || 'INTERNATIONAL ARENA';
      document.getElementById('tossText').textContent = config.tossInfo || 'TOSS TO TAKE PLACE SHORTLY';
    }

    // Countdown Timer
    function startCountdown() {
      const targetTime = new Date(config.countdownTarget).getTime();
      const el = document.getElementById('countdownDisplay');

      function update() {
        const now = Date.now();
        const diff = Math.max(0, targetTime - now);
        const mins = Math.floor(diff / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        el.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        if (diff > 0) requestAnimationFrame(() => setTimeout(update, 1000));
      }
      update();
    }

    // goLive Transition Trigger
    function goLive() {
      const badge = document.getElementById('statusBadge');
      const tag = document.getElementById('tagText');
      tag.textContent = 'LIVE';
      badge.classList.add('live-active');

      setTimeout(() => {
        const panel = document.getElementById('arenaPanel');
        panel.classList.add('exiting');
      }, 700);
    }

    // BroadcastChannel sync
    try {
      const bc = new BroadcastChannel('cricdeck_overlay_sync');
      bc.onmessage = (e) => {
        if (e.data && e.data.type === 'MATCH_UPDATE') {
          const d = e.data.data;
          config.teamACode = d.teamACode || config.teamACode;
          config.teamAName = d.teamAName || config.teamAName;
          config.teamAColor = d.teamAColor || config.teamAColor;
          config.teamALogo = d.teamALogo || config.teamALogo;
          config.teamBCode = d.teamBCode || config.teamBCode;
          config.teamBName = d.teamBName || config.teamBName;
          config.teamBColor = d.teamBColor || config.teamBColor;
          config.teamBLogo = d.teamBLogo || config.teamBLogo;
          config.matchTitle = d.matchTitle || config.matchTitle;
          config.venue = d.venue || config.venue;
          config.tossInfo = d.tossInfo || config.tossInfo;
          renderOverlay();
        } else if (e.data && e.data.type === 'GO_LIVE') {
          goLive();
        }
      };
    } catch (_) {}

    // Keyboard Shortcuts: 'B' for Dark Test Background, 'L' for goLive
    window.addEventListener('keydown', (e) => {
      if (e.key === 'b' || e.key === 'B') document.body.classList.toggle('test-bg');
      if (e.key === 'l' || e.key === 'L') goLive();
    });

    window.goLive = goLive;
    loadSharedMatchData();
    startCountdown();
  </script>
</body>
</html>
