<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Overlay 5 — Minimal Vertical Stack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }
    body.test-bg {
      background: #11141a url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><rect width="80" height="80" fill="%2311141a"/><path d="M0 0h80v80H0z" fill="none" stroke="%231b202a" stroke-width="1"/></svg>') repeat !important;
    }

    .viewport {
      position: relative;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
    }

    /* Right-side panel: x 1300 to 1920 (width 620px), full height with Liquid Glass */
    .vertical-stack-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: 620px;
      height: 1080px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.01) 100%), rgba(10, 10, 10, 0.82);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-left: 2px solid #C8FF00; /* Left edge line 2px #C8FF00 */
      box-shadow: -25px 0 60px rgba(0, 0, 0, 0.7), inset 1px 0 0 rgba(255, 255, 255, 0.2);
      padding: 96px 64px; /* 96px safe margin */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #FFFFFF;
      transform: translateX(0);
      pointer-events: auto;
    }

    .vertical-stack-panel.exiting {
      transform: translateX(100%);
      transition: transform 600ms cubic-bezier(0.7, 0, 0.84, 0);
    }

    /* Staggered fade-up animation */
    .stagger-item {
      opacity: 0;
      transform: translateY(24px);
      animation: fadeUp 550ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .stagger-1 { animation-delay: 80ms; }
    .stagger-2 { animation-delay: 160ms; }
    .stagger-3 { animation-delay: 240ms; }
    .stagger-4 { animation-delay: 320ms; }
    .stagger-5 { animation-delay: 400ms; }
    .stagger-6 { animation-delay: 480ms; }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(24px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Status badge */
    .status-badge {
      display: inline-block;
      align-self: flex-start;
      background: rgba(200, 255, 0, 0.12);
      border: 1px solid #C8FF00;
      color: #C8FF00;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 4px;
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }
    .status-badge.live-mode {
      background: #E63946;
      border-color: #E63946;
      color: #FFFFFF;
    }

    /* Series Label */
    .series-label {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #C8FF00;
      margin-bottom: 8px;
    }

    /* Match Title */
    .match-title {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.05;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      margin-bottom: 40px;
    }

    /* Team Rows */
    .team-rows {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 30px;
    }

    .team-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 20px;
      border-radius: 8px;
    }
    .team-row-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .team-logo-square {
      width: 56px;
      height: 56px;
      background: #1A1A1A;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: #C8FF00;
      font-size: 20px;
    }
    .team-name-text {
      font-size: 20px;
      font-weight: 600;
      color: #E5E5E5;
    }
    .team-code-mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 48px;
      font-weight: 500;
      color: #FFFFFF;
      line-height: 1;
    }

    /* Venue */
    .venue-text {
      font-size: 20px;
      font-weight: 400;
      color: #8A8A8A;
      line-height: 1.4;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 24px;
    }
    .toss-subtext {
      font-size: 15px;
      color: #C8FF00;
      margin-top: 6px;
      font-weight: 500;
    }

    /* Countdown Anchored at Bottom */
    .countdown-section {
      margin-top: auto;
      padding-top: 30px;
    }
    .countdown-caption {
      font-size: 12px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #8A8A8A;
      margin-bottom: 8px;
    }
    .countdown-mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 96px;
      font-weight: 500;
      color: #FFFFFF;
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    /* Test controls */
    .controls-overlay {
      position: absolute;
      top: 30px;
      left: 30px;
      display: flex;
      gap: 10px;
      z-index: 9999;
      pointer-events: auto;
    }
    .ctrl-btn {
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    @media (prefers-reduced-motion: reduce) {
      .stagger-item {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .vertical-stack-panel {
        transition: opacity 0.2s ease !important;
      }
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="controls-overlay">
      <button class="ctrl-btn" onclick="toggleTestBg()">Toggle Dark BG (B)</button>
      <button class="ctrl-btn" style="background: #C8FF00; color: #000;" onclick="window.goLive()">Trigger Go Live</button>
    </div>

    <!-- Right-side Stack Panel (x: 1300 to 1920) -->
    <div class="vertical-stack-panel" id="mainPanel">
      <div>
        <!-- Status -->
        <div class="stagger-item stagger-1">
          <span class="status-badge" id="liveTag">PRE-MATCH</span>
        </div>

        <!-- Series Label -->
        <div class="stagger-item stagger-2">
          <div class="series-label" id="seriesLabel">{SERIES}</div>
        </div>

        <!-- Match Title -->
        <div class="stagger-item stagger-3">
          <h1 class="match-title" id="matchTitle">{MATCH_TITLE}</h1>
        </div>

        <!-- Team Rows -->
        <div class="team-rows stagger-item stagger-4">
          <!-- Team A Row -->
          <div class="team-row">
            <div class="team-row-left">
              <div class="team-logo-square" id="teamAFallback">{TEAM_A_CODE}</div>
              <span class="team-name-text" id="teamAName">{TEAM_A_NAME}</span>
            </div>
            <span class="team-code-mono" id="teamACode">{TEAM_A_CODE}</span>
          </div>

          <!-- Team B Row -->
          <div class="team-row">
            <div class="team-row-left">
              <div class="team-logo-square" id="teamBFallback">{TEAM_B_CODE}</div>
              <span class="team-name-text" id="teamBName">{TEAM_B_NAME}</span>
            </div>
            <span class="team-code-mono" id="teamBCode">{TEAM_B_CODE}</span>
          </div>
        </div>

        <!-- Venue & Toss -->
        <div class="stagger-item stagger-5">
          <div class="venue-text" id="venueText">{VENUE}</div>
          <div class="toss-subtext" id="tossInfo">{TOSS_INFO}</div>
        </div>
      </div>

      <!-- Countdown (Anchored at the bottom) -->
      <div class="countdown-section stagger-item stagger-6">
        <div class="countdown-caption">COUNTDOWN TO FIRST BALL</div>
        <div class="countdown-mono" id="countdownVal">05:45</div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const data = {
      teamA: params.get('teamA') || 'WI',
      teamAName: params.get('teamAName') || 'West Indies',
      teamB: params.get('teamB') || 'BAN',
      teamBName: params.get('teamBName') || 'Bangladesh',
      series: params.get('series') || 'SUPER 8 LEAGUE',
      matchTitle: params.get('title') || 'Match 24',
      venue: params.get('venue') || 'Kensington Oval, Bridgetown',
      tossInfo: params.get('toss') || 'Match starts shortly',
      minutes: parseFloat(params.get('minutes')) || 5.75
    };

    document.getElementById('seriesLabel').textContent = data.series;
    document.getElementById('matchTitle').textContent = data.matchTitle;
    document.getElementById('teamAName').textContent = data.teamAName;
    document.getElementById('teamACode').textContent = data.teamA;
    document.getElementById('teamAFallback').textContent = data.teamA;
    document.getElementById('teamBName').textContent = data.teamBName;
    document.getElementById('teamBCode').textContent = data.teamB;
    document.getElementById('teamBFallback').textContent = data.teamB;
    document.getElementById('venueText').textContent = data.venue;
    document.getElementById('tossInfo').textContent = data.tossInfo;

    // Countdown
    let totalSecs = Math.floor(data.minutes * 60);
    const cdEl = document.getElementById('countdownVal');
    setInterval(() => {
      if (totalSecs <= 0) {
        cdEl.textContent = '00:00';
        return;
      }
      totalSecs--;
      const m = String(Math.floor(totalSecs / 60)).padStart(2, '0');
      const s = String(totalSecs % 60).padStart(2, '0');
      cdEl.textContent = `${m}:${s}`;
    }, 1000);

    // goLive() transition
    window.goLive = function() {
      const panel = document.getElementById('mainPanel');
      const tag = document.getElementById('liveTag');
      tag.textContent = 'LIVE NOW';
      tag.classList.add('live-mode');
      setTimeout(() => {
        panel.classList.add('exiting');
      }, 900);
    };

    function toggleTestBg() {
      document.body.classList.toggle('test-bg');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'b' || e.key === 'B') toggleTestBg();
      if (e.key === 'l' || e.key === 'L') window.goLive();
    });
  </script>
</body>
</html>
